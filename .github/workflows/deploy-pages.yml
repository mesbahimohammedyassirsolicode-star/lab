name: Deploy Marp presentations to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Marp presentations
        run: |
          mkdir -p _site

          echo "Building labmarp.md..."
          npx --yes @marp-team/marp-cli@latest labs/labmarp.md \
            --html \
            --output _site/labmarp.html

          echo "Building project presentation..."
          npx --yes @marp-team/marp-cli@latest presentations/presentation_projet_fil_rouge_marp.md \
            --html \
            --output _site/presentation-projet-fil-rouge.html

          echo "Copying website..."
          cp site/index.html _site/index.html

          echo "Generated files:"
          ls -lah _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4